<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="100%" height="100%">
  <!-- Navy Square Border -->
  <rect
    x="95"
    y="25"
    width="210"
    height="210"
    fill="none"
    stroke="#103d65"
    stroke-width="16"
    stroke-linejoin="miter"
  />

  <!-- Intertwined DS Mark inside Square -->
  <g fill="#103d65">
    <!-- D vertical bar -->
    <rect x="120" y="52" width="20" height="156" />

    <!-- D curve -->
    <path
      d="M 140 52 
         L 190 52 
         C 225 52 245 75 245 130 
         C 245 185 225 208 190 208 
         L 140 208 
         L 140 188 
         L 188 188 
         C 210 188 223 172 223 130 
         C 223 88 210 72 188 72 
         L 140 72 
         Z"
    />

    <!-- S curve intertwined -->
    <path
      d="M 235 78 
         L 235 98 
         C 230 92 215 85 195 85 
         C 172 85 158 96 158 112 
         C 158 126 170 134 195 142 
         C 228 152 248 165 248 190 
         C 248 218 222 232 188 232 
         C 160 232 140 220 132 210 
         L 142 192 
         C 152 204 168 212 188 212 
         C 210 212 225 204 225 190 
         C 225 176 215 168 188 160 
         C 155 148 138 135 138 112 
         C 138 88 160 68 195 68 
         C 212 68 226 72 235 78 Z"
      fill="#103d65"
      opacity="0.95"
    />
  </g>

  <!-- Wordmark DIGITAL SOCH -->
  <text
    x="200"
    y="285"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#103d65"
    letter-spacing="2"
  >
    DIGITAL SOCH
  </text>

  <!-- Tagline: Go digital!! with orange accent bars -->
  <g>
    <!-- Left line -->
    <line x1="65" y1="318" x2="140" y2="318" stroke="#f15a24" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Script text Go digital!! -->
    <text
      x="200"
      y="326"
      text-anchor="middle"
      font-family="'Brush Script MT', 'Segoe Script', 'Caveat', cursive, sans-serif"
      font-style="italic"
      font-size="28"
      font-weight="700"
      fill="#f15a24"
    >
      Go digital!!
    </text>

    <!-- Right line -->
    <line x1="260" y1="318" x2="335" y2="318" stroke="#f15a24" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
