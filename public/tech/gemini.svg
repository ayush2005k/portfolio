<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Multi-stop gradient simulating Google Gemini rainbow star in Image 3 -->
    <radialGradient id="gemini-star-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7260db"/>
      <stop offset="35%" stop-color="#4285f4"/>
      <stop offset="70%" stop-color="#ea4335"/>
      <stop offset="100%" stop-color="#fbbc05"/>
    </radialGradient>
    <linearGradient id="gemini-vert" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="45%" stop-color="#A142F4"/>
      <stop offset="75%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="gemini-horiz" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FBBC05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <!-- 4-pointed star from Image 3 -->
  <path fill="url(#gemini-vert)" d="M50 8C50 31.2 31.2 50 8 50C31.2 50 50 68.8 50 92C50 68.8 68.8 50 92 50C68.8 50 50 31.2 50 8Z"/>
  <path fill="url(#gemini-horiz)" mix-blend-mode="screen" opacity="0.6" d="M50 8C50 31.2 31.2 50 8 50C31.2 50 50 68.8 50 92C50 68.8 68.8 50 92 50C68.8 50 50 31.2 50 8Z"/>
</svg>
